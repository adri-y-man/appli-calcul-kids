<style>
  :root {
    --sky-top: #4fb3e8;
    --sky-bottom: #c9d9f5;
    --ground: #4bd07a;
    --ink: #1f2a3c;
    --white: #ffffff;

    --green-add: #43b98a;
    --orange-sub: #f2994a;
    --correct: #2fbf71;
    --wrong: #ff4d5e;
    --gold: #ffc93c;

    --candy-pink: #ef5da8;
    --candy-teal: #33c2c2;
    --candy-blue: #598ce6;
    --candy-tangerine: #ffb648;

    --green-add-light: #a1dcc4;
    --orange-sub-light: #f9cca5;
    --candy-blue-light: #c1d6f5;
    --candy-pink-light: #f7aed4;

    --fs-eyebrow: clamp(0.9rem, 3.2vw, 1.1rem);
    --fs-problem: clamp(3.8rem, 20vw, 8rem);
    --fs-op: clamp(2.9rem, 14.5vw, 6rem);
    --fs-button: clamp(2.3rem, 12vw, 3.8rem);
    --fs-feedback: clamp(1.2rem, 4.6vw, 1.9rem);
    --pill-num-size: clamp(1.9rem, 6vw, 2.5rem);
    --pill-num-fs: clamp(1rem, 3.4vw, 1.3rem);
    --star-size: clamp(1.6rem, 5.4vw, 2.2rem);

    --font-hand: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", system-ui,
      -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif,
      "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    height: 100dvh;
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-top) 38%, var(--sky-bottom) 100%);
    font-family: var(--font-hand);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .scene {
    position: relative;
    width: 100%;
    max-width: 56rem;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(0.75rem, env(safe-area-inset-top)) max(0.9rem, env(safe-area-inset-right)) max(1.8rem, calc(env(safe-area-inset-bottom) + 1.2rem)) max(0.9rem, env(safe-area-inset-left));
    gap: clamp(0.5rem, 2vw, 0.9rem);
    isolation: isolate;
  }

  /* ---------- sky decoration ---------- */

  .deco {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    border-radius: inherit;
    pointer-events: none;
  }

  .sun {
    position: absolute;
    top: -6%;
    right: -8%;
    width: 34vmin;
    height: 34vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #fff2b8, var(--gold) 70%);
    box-shadow: 0 0 0 14px rgba(255, 255, 255, 0.18);
  }

  .cloud {
    position: absolute;
    background: var(--white);
    opacity: 0.85;
    border-radius: 999px;
  }

  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 999px;
  }

  .cloud-a { width: 20vw; height: 6vw; min-width: 110px; min-height: 34px; top: 8%; left: -4%; }
  .cloud-a::before { width: 55%; height: 140%; top: -60%; left: 8%; }
  .cloud-a::after { width: 40%; height: 110%; top: -40%; right: 10%; }

  .cloud-b { width: 15vw; height: 5vw; min-width: 90px; min-height: 28px; top: 20%; right: 6%; }
  .cloud-b::before { width: 50%; height: 130%; top: -55%; left: 10%; }
  .cloud-b::after { width: 35%; height: 100%; top: -35%; right: 12%; }

  .ground {
    position: absolute;
    left: -5%;
    right: -5%;
    bottom: -4%;
    height: 16%;
    background: var(--ground);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .sun { animation: drift 9s ease-in-out infinite; }
    .cloud-a { animation: float-a 16s ease-in-out infinite; }
    .cloud-b { animation: float-b 13s ease-in-out infinite; }
  }

  @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5%); } }
  @keyframes float-a { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3%); } }
  @keyframes float-b { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-3%); } }

  /* ---------- top bar ---------- */

  .topbar {
    flex: 0 0 auto;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: clamp(0.5rem, 2vw, 0.9rem);
    margin: calc(-1 * max(0.75rem, env(safe-area-inset-top))) calc(-1 * max(0.9rem, env(safe-area-inset-right))) 0 calc(-1 * max(0.9rem, env(safe-area-inset-left)));
    padding: calc(env(safe-area-inset-top) + 0.4rem) clamp(0.9rem, 3vw, 1.4rem) 0.55rem;
    max-height: calc(2cm + env(safe-area-inset-top));
    background: rgba(255, 255, 255, 0.85);
    border-radius: 0 0 1.6rem 1.6rem;
    box-shadow: 0 6px 0 rgba(31, 42, 60, 0.1);
  }

  .level-pill {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0 auto;
  }

  .level-pill .num {
    appearance: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    display: grid;
    place-items: center;
    width: var(--pill-num-size);
    height: var(--pill-num-size);
    border-radius: 50%;
    background: var(--candy-blue);
    color: var(--white);
    font-weight: 800;
    font-size: var(--pill-num-fs);
  }

  .level-pill .num:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  .level-pill .num[data-mode="add"],
  .level-pill .num[data-mode="add3"] { background: var(--green-add); }
  .level-pill .num[data-mode="sub"],
  .level-pill .num[data-mode="sub3"] { background: var(--orange-sub); }
  .level-pill .num[data-mode="mul"],
  .level-pill .num[data-mode="mul3"] { background: var(--candy-blue); }
  .level-pill .num[data-mode="div"],
  .level-pill .num[data-mode="div3"] { background: var(--candy-pink); }
  .level-pill .num[data-mode="costaud"] { background: linear-gradient(135deg, #ff7a59, #ff3d77); }
  .level-pill .num[data-mode="mixas"],
  .level-pill .num[data-mode="mixall"] { background: linear-gradient(135deg, #ff7a59, #ff3d77); }

  .level-pill .label {
    font-size: var(--fs-eyebrow);
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  .stars {
    display: flex;
    justify-content: center;
    gap: 0.3rem;
  }

  .stars svg {
    width: var(--star-size);
    height: var(--star-size);
    fill: rgba(31, 42, 60, 0.15);
    transition: fill 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center;
  }

  .stars svg.filled {
    fill: var(--gold);
    transform: scale(1.2) rotate(-6deg);
  }

  .max-badge {
    flex: 0 0 auto;
    text-align: center;
    font-size: var(--fs-eyebrow);
    font-weight: 800;
    color: var(--white);
    text-shadow: 0 2px 0 rgba(31, 42, 60, 0.25);
  }

  .max-badge[hidden] { display: none; }

  /* ---------- problem ---------- */

  .problem-zone {
    flex: 1.05 1 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .problem {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(0.3rem, 2vw, 0.7rem);
    font-size: var(--fs-problem);
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .problem .num {
    color: var(--white);
    -webkit-text-stroke: clamp(2px, 0.6vw, 5px) var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 clamp(4px, 1vw, 8px) 0 rgba(31, 42, 60, 0.18);
  }

  .problem .op,
  .mode-card .op-icon {
    display: inline-block;
    font-size: var(--fs-op);
    font-weight: 900;
    line-height: 1;
  }

  .problem .op { color: var(--ink); }

  .mode-card .op-icon[data-op="add"] { color: var(--green-add-light); }
  .mode-card .op-icon[data-op="sub"] { color: var(--orange-sub-light); }
  .mode-card .op-icon[data-op="mul"] { color: var(--candy-blue-light); }
  .mode-card .op-icon[data-op="div"] { color: var(--candy-pink-light); }

  .problem .eq {
    color: var(--ink);
    font-size: var(--fs-op);
  }

  .problem .q {
    color: var(--white);
    -webkit-text-stroke: clamp(2px, 0.55vw, 4px) var(--ink);
    paint-order: stroke fill;
  }

  .problem .paren {
    color: var(--ink);
    font-size: var(--fs-op);
  }

  /* ---------- feedback ---------- */

  .feedback {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: clamp(2.6rem, 8vh, 3.6rem);
    margin: 0;
    text-align: center;
    font-size: var(--fs-feedback);
    font-weight: 800;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.1em;
  }

  .feedback .line-1 { color: var(--white); text-shadow: 0 2px 0 rgba(31, 42, 60, 0.2); }
  .feedback[data-tone="correct"] .line-1 { color: var(--correct); text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6); }
  .feedback[data-tone="wrong"] .line-1 { color: var(--wrong); text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6); }
  .feedback .line-2 { font-size: 0.62em; font-weight: 700; color: var(--ink); }

  .emoji {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
  }

  /* ---------- answers ---------- */

  .answers {
    flex: 1.5 1 0;
    display: flex;
    flex-direction: column;
    gap: clamp(0.6rem, 2.4vw, 1rem);
    min-height: 0;
    width: 75%;
    align-self: center;
  }

  @media (min-width: 640px) {
    .answers { flex-direction: row; }
  }

  /* mobile portrait : on pousse encore les tailles pour profiter de l'écran étroit et haut */
  @media (max-width: 640px) and (orientation: portrait) {
    :root {
      --fs-eyebrow: clamp(1.05rem, 4.4vw, 1.3rem);
      --fs-problem: clamp(4.6rem, 25vw, 7rem);
      --fs-op: clamp(3.5rem, 19vw, 5.4rem);
      --fs-button: clamp(2.8rem, 15vw, 4.2rem);
      --pill-num-size: clamp(2.4rem, 9vw, 3rem);
      --pill-num-fs: clamp(1.3rem, 4.8vw, 1.6rem);
      --star-size: clamp(1.85rem, 7vw, 2.4rem);
    }

    /* addition / soustraction / multiplication / division : 2 termes,
       un peu plus petit que la taille de base pour aérer l'écran. */
    .problem[data-terms="2"] {
      --fs-problem: clamp(4.1rem, 22vw, 6.3rem);
      --fs-op: clamp(3.1rem, 17vw, 4.9rem);
    }

    /* calcul costaud (3 termes, parfois avec parenthèses) : la ligne est
       trop longue pour garder la même taille que les calculs à 2 termes
       sans déborder ou passer à la ligne. */
    .problem[data-terms="3"] {
      --fs-problem: clamp(3.1rem, 17.4vw, 4.7rem);
      --fs-op: clamp(2.35rem, 12.3vw, 3.6rem);
      gap: clamp(0.08rem, 0.5vw, 0.2rem);
    }
  }

  .answer-btn {
    flex: 1;
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 800;
    font-size: var(--fs-button);
    color: var(--white);
    background: var(--candy-teal);
    border-radius: clamp(1.2rem, 4vw, 2rem);
    border-bottom: clamp(5px, 1.4vw, 9px) solid rgba(0, 0, 0, 0.22);
    box-shadow: 0 10px 22px -10px rgba(31, 42, 60, 0.45);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease, opacity 0.2s ease;
    font-variant-numeric: tabular-nums;
    min-height: 4.5rem;
  }

  .answer-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .answer-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }

  .answer-btn:focus-visible {
    outline: 4px solid var(--ink);
    outline-offset: 3px;
  }

  .answer-btn:disabled { cursor: default; }

  .answer-btn.candy-pink { background: var(--candy-pink); }
  .answer-btn.candy-teal { background: var(--candy-teal); }
  .answer-btn.candy-blue { background: var(--candy-blue); }
  .answer-btn.candy-tangerine { background: var(--candy-tangerine); }

  .answer-btn.is-correct {
    background: var(--correct);
    border-bottom-color: rgba(0, 0, 0, 0.28);
  }

  .answer-btn.is-wrong {
    background: var(--wrong);
    border-bottom-color: rgba(0, 0, 0, 0.28);
  }

  .answer-btn.is-faded {
    opacity: 0.4;
    filter: saturate(0.7);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .pop { animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop {
    0% { transform: scale(0.9); }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3%); }
    40% { transform: translateX(3%); }
    60% { transform: translateX(-2%); }
    80% { transform: translateX(2%); }
  }

  /* ---------- écrans de célébration (niveau supérieur / victoire) ---------- */

  .celebrate-overlay {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: clamp(1rem, 4vw, 2rem);
  }

  .celebrate-overlay[hidden] { display: none; }

  .celebrate-levelup { background: linear-gradient(160deg, #ffd166, #ff8fa3); }
  .celebrate-win { background: linear-gradient(160deg, #ffd166, #ff8a3d); }

  .celebrate-panel {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 24rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.6rem;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 1.5rem;
    padding: clamp(1.6rem, 6vw, 2.4rem) clamp(1.3rem, 5vw, 2rem);
    box-shadow: 0 24px 50px -20px rgba(31, 42, 60, 0.55);
  }

  .celebrate-badge {
    font-size: clamp(3rem, 12vw, 4.2rem);
    line-height: 1;
    animation: celebrate-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .celebrate-title {
    margin: 0;
    font-size: clamp(1.8rem, 7vw, 2.4rem);
    font-weight: 900;
    color: var(--ink);
  }

  .celebrate-sub {
    margin: 0;
    font-size: clamp(1.05rem, 4vw, 1.3rem);
    font-weight: 700;
    color: var(--ink);
  }

  .celebrate-sub span { font-variant-numeric: tabular-nums; }

  .celebrate-btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    margin-top: 0.5rem;
    padding: 0.8rem 1.6rem;
    border-radius: 999px;
    font-weight: 800;
    font-size: clamp(1rem, 3.6vw, 1.2rem);
    color: var(--white);
    background: var(--candy-blue);
    border-bottom: 4px solid rgba(0, 0, 0, 0.22);
    box-shadow: 0 8px 16px -10px rgba(31, 42, 60, 0.5);
  }

  .celebrate-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .celebrate-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .celebrate-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem;
  }

  .celebrate-btn-secondary { background: var(--candy-teal); }

  @keyframes celebrate-pop {
    0% { transform: scale(0.4) rotate(-15deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1rem, 4vw, 2rem);
    background: rgba(31, 42, 60, 0.55);
  }

  .confirm-overlay[hidden] { display: none; }

  .confetti {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .confetti-piece {
    position: absolute;
    top: -8%;
    width: 0.55rem;
    height: 0.85rem;
    border-radius: 2px;
    opacity: 0.95;
    animation-name: confetti-fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  @keyframes confetti-fall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift, 0px), 118vh) rotate(600deg); opacity: 0.85; }
  }

  @media (prefers-reduced-motion: reduce) {
    .celebrate-badge { animation: none; }
    .confetti-piece { display: none; }
  }

  /* ---------- menu picto + écran de choix du jeu ---------- */

  .menu-btn {
    flex: none;
    width: clamp(2.1rem, 7vw, 2.5rem);
    height: clamp(2.1rem, 7vw, 2.5rem);
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
  }

  .menu-btn svg { width: 55%; height: 55%; }

  .menu-btn svg path { stroke: var(--ink); }

  .menu-btn:focus-visible {
    outline: 3px solid var(--candy-blue);
    outline-offset: 2px;
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1rem, 4vw, 2rem) clamp(1rem, 4vw, 2rem) clamp(5rem, 16vh, 8rem);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  }

  .menu-overlay[hidden] { display: none; }


  .menu-brand {
    position: absolute;
    top: max(0.8rem, env(safe-area-inset-top));
    left: max(0.9rem, env(safe-area-inset-left));
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .menu-brand-text {
    font-family: "Comic Sans MS", "Comic Sans", "Segoe Print", "Chalkboard SE", "Bradley Hand", cursive;
    font-size: clamp(1.35rem, 5.2vw, 1.8rem);
    font-weight: 700;
    color: var(--white);
    text-shadow: 0 2px 0 rgba(31, 42, 60, 0.25);
  }

<script>
  (function () {
    "use strict";

    var MIN_LEVEL = 1;
    var MAX_LEVEL = 5;
    var STARS_TO_LEVEL_UP = 5;
    var MISTAKES_TO_LEVEL_DOWN = 3;
    var CANDY_COLORS = ["candy-pink", "candy-teal", "candy-blue", "candy-tangerine"];
    var OP_KEYS = ["add", "sub", "mul", "div"];
    var OP_SYMBOL = { add: "+", sub: "−", mul: "×", div: "÷" };
    var OP_ARIA_LABEL = { add: "plus", sub: "moins", mul: "fois", div: "divisé par" };
    var MODE_TO_OP_3 = { add3: "add", sub3: "sub", mul3: "mul", div3: "div" };
    var MIX_MODES = { mixas: ["add", "sub"], mixall: OP_KEYS };

    var BASE_LEVELS = {
      add: { param: [5, 10, 15, 20, 25], maxResult: 30 },
      sub: { param: [5, 10, 15, 20, 25] },
      mul: { param: [3, 5, 7, 9, 10] },
      div: { param: [3, 5, 7, 9, 10] }
    };

    // Calcul costaud : 3 termes, 2 opérations tirées indépendamment (donc
    // potentiellement différentes) parmi +, −, ×, ÷, enchaînées de gauche à
    // droite. Chaque étape est bornée pour rester positive, entière, et sous
    // overallMax.
    var COSTAUD3_LEVELS = {
      overallMax: [20, 30, 45, 60, 80],
      addSubRange: [5, 7, 10, 12, 15],
      mulRange: [3, 4, 5, 6, 7],
      divRange: [3, 4, 5, 6, 7]
    };

    var state = {
      mode: null,
      level: MIN_LEVEL,
      correctStreak: 0,
      wrongStreak: 0,
      problem: null,
      locked: false
    };

    var PROGRESS_KEY = "calculMalinProgress";

    function loadProgress() {
      try {
        var raw = window.localStorage.getItem(PROGRESS_KEY);
        if (!raw) return {};
        var data = JSON.parse(raw);
        return data && typeof data === "object" ? data : {};
      } catch (e) {
        return {};
      }
    }

    function saveProgress() {
      if (!state.mode) return;
      try {
        var data = loadProgress();
        data[state.mode] = { level: state.level, stars: state.correctStreak };
        window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
      } catch (e) {
        // localStorage indisponible (navigation privée, quota...) : on ignore.
      }
    }

    function randInt(minInclusive, maxInclusive) {
      return Math.floor(Math.random() * (maxInclusive - minInclusive + 1)) + minInclusive;
    }

    // Tire un terme entre 0 et maxInclusive, mais le 0 ne sort que ~6% du
    // temps au lieu d'être aussi probable que n'importe quel autre chiffre.
    function randTermRareZero(maxInclusive) {
      if (maxInclusive <= 0) return 0;
      if (Math.random() < 0.06) return 0;
      return randInt(1, maxInclusive);
    }

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    function generateAddition(maxTerm, maxResult) {
      var a, b, maxB;
      do {
        a = randTermRareZero(maxTerm);
        maxB = Math.min(maxTerm, maxResult - a);
        b = randTermRareZero(maxB);
      } while (a === 0 && b === 0);
      return { a: a, b: b };
    }

    function generateSubtraction(maxTerm) {
      var a = randInt(1, maxTerm);
      var b = randTermRareZero(a);
      return { a: a, b: b };
    }

    function generateMultiplication(maxFactor) {
      var a, b;
      do {
        a = randTermRareZero(maxFactor);
        b = randTermRareZero(maxFactor);
      } while (a === 0 && b === 0);
      return { a: a, b: b };
    }

    function generateDivision(maxFactor) {
      var divisor = randInt(1, maxFactor);
      var quotient = randTermRareZero(maxFactor);
      return { a: divisor * quotient, b: divisor };
    }

    function computeAnswer(opKey, a, b) {
      if (opKey === "add") return a + b;
      if (opKey === "sub") return a - b;
      if (opKey === "mul") return a * b;
      return b === 0 ? 0 : a / b;
    }

    function buildTerms(opKey, levelIdx) {
      var table = BASE_LEVELS[opKey];
      var param = table.param[levelIdx];
      if (opKey === "add") {
        var t = generateAddition(param, table.maxResult);
        return { a: t.a, b: t.b, upperBound: table.maxResult };
      }
      if (opKey === "sub") {
        var t2 = generateSubtraction(param);
        return { a: t2.a, b: t2.b, upperBound: param };
      }
      if (opKey === "mul") {
        var t3 = generateMultiplication(param);
        return { a: t3.a, b: t3.b, upperBound: param * param };
      }
      var t4 = generateDivision(param);
      return { a: t4.a, b: t4.b, upperBound: param };
    }

    function generateChoices(answer, upperBound) {
      var choices = new Set([answer]);
      var big = answer >= 40 || upperBound >= 60;
      var deltas = shuffle(big ? [-7, -5, -3, 3, 5, 7] : [-3, -2, -1, 1, 2, 3]);
      for (var d = 0; d < deltas.length && choices.size < 3; d++) {
        var candidate = answer + deltas[d];
        if (candidate >= 0 && candidate <= upperBound) choices.add(candidate);
      }
      var tries = 0;
      while (choices.size < 3 && tries < 200) {
        choices.add(randInt(0, Math.max(upperBound, 2)));
        tries++;
      }
      return shuffle(Array.from(choices));
    }

    function applyCostaudStep(opKey, current, table) {
      if (opKey === "add") {
        var maxAddTerm = Math.max(0, Math.min(table.addSubRange, table.overallMax - current));
        var addTerm = randTermRareZero(maxAddTerm);
        return { term: addTerm, value: current + addTerm };
      }
      if (opKey === "sub") {
        var maxSubTerm = Math.min(table.addSubRange, current);
        var subTerm = randTermRareZero(maxSubTerm);
        return { term: subTerm, value: current - subTerm };
      }
      if (opKey === "mul") {
        if (current === 0) {
          var factorAtZero = randInt(1, table.mulRange);
          return { term: factorAtZero, value: 0 };
        }
        var maxFactor = Math.max(1, Math.min(table.mulRange, Math.floor(table.overallMax / current)));
        var factor = randInt(1, maxFactor);
        return { term: factor, value: current * factor };
      }
      // div
      if (current === 0) {
        var divisorAtZero = randInt(1, table.divRange);
        return { term: divisorAtZero, value: 0 };
      }
      var maxDivisor = Math.min(table.divRange, current);
      var divisors = [];
      for (var d = 1; d <= maxDivisor; d++) {
        if (current % d === 0) divisors.push(d);
      }
      var divisor = divisors[randInt(0, divisors.length - 1)];
      return { term: divisor, value: current / divisor };
    }

    function costaudTable(levelIdx) {
      return {
        overallMax: COSTAUD3_LEVELS.overallMax[levelIdx],
        addSubRange: COSTAUD3_LEVELS.addSubRange[levelIdx],
        mulRange: COSTAUD3_LEVELS.mulRange[levelIdx],
        divRange: COSTAUD3_LEVELS.divRange[levelIdx]
      };
    }

    function generateCostaudProblem(levelIdx) {
      var table = costaudTable(levelIdx);
      var op1 = OP_KEYS[randInt(0, OP_KEYS.length - 1)];
      var op2 = OP_KEYS[randInt(0, OP_KEYS.length - 1)];
      var t1 = randTermRareZero(table.addSubRange);
      var step1 = applyCostaudStep(op1, t1, table);
      var step2 = applyCostaudStep(op2, step1.value, table);
      return {
        terms: [t1, step1.term, step2.term],
        ops: [op1, op2],
        answer: step2.value,
        choices: generateChoices(step2.value, table.overallMax)
      };
    }

    // "Addition/Soustraction/Multiplication/Division à 3 termes" : même
    // mécanique que le calcul costaud, mais avec la même opération enchaînée
    // deux fois de suite au lieu de deux opérations tirées indépendamment.
    function generateFixedOpProblem(opKey, levelIdx) {
      var table = costaudTable(levelIdx);
      var t1 = randTermRareZero(table.addSubRange);
      var step1 = applyCostaudStep(opKey, t1, table);
      var step2 = applyCostaudStep(opKey, step1.value, table);
      return {
        terms: [t1, step1.term, step2.term],
        ops: [opKey, opKey],
        answer: step2.value,
        choices: generateChoices(step2.value, table.overallMax)
      };
    }

    function sameProblem(p1, p2) {
      if (!p1 || !p2) return false;
      if (p1.ops.length !== p2.ops.length || p1.terms.length !== p2.terms.length) return false;
      for (var i = 0; i < p1.ops.length; i++) {
        if (p1.ops[i] !== p2.ops[i]) return false;
      }
      for (var j = 0; j < p1.terms.length; j++) {
        if (p1.terms[j] !== p2.terms[j]) return false;
      }
      return true;
    }

    function buildOneProblem(levelIdx) {
      if (state.mode === "costaud") {
        return generateCostaudProblem(levelIdx);
      }
      if (MODE_TO_OP_3[state.mode]) {
        return generateFixedOpProblem(MODE_TO_OP_3[state.mode], levelIdx);
      }
      var mixChoices = MIX_MODES[state.mode];
      var opKey = mixChoices ? mixChoices[randInt(0, mixChoices.length - 1)] : state.mode;
      var t = buildTerms(opKey, levelIdx);
      var answer = computeAnswer(opKey, t.a, t.b);
      return {
        terms: [t.a, t.b],
        ops: [opKey],
        answer: answer,
        choices: generateChoices(answer, t.upperBound)
      };
    }

    // Régénère tant que le calcul tiré est identique au précédent, pour
    // éviter d'afficher deux fois de suite exactement le même calcul.
    function generateProblem(previous) {
      var levelIdx = Math.min(Math.max(state.level, MIN_LEVEL), MAX_LEVEL) - 1;
      var problem;
      var tries = 0;
      do {
        problem = buildOneProblem(levelIdx);
        tries++;
      } while (previous && sameProblem(problem, previous) && tries < 30);
      return problem;
    }

    var els = {
      menuBtn: document.getElementById("menuBtn"),
      menuOverlay: document.getElementById("menuOverlay"),
      menuHome: document.getElementById("menuHome"),
      menuTerms2: document.getElementById("menuTerms2"),
      menuTerms3: document.getElementById("menuTerms3"),
      categoryCards: document.querySelectorAll(".category-card"),
      terms2BackBtn: document.getElementById("terms2BackBtn"),
      terms3BackBtn: document.getElementById("terms3BackBtn"),
      modeCards: document.querySelectorAll(".mode-card"),
      levelNum: document.getElementById("levelNum"),
      stars: document.getElementById("stars"),
      maxBadge: document.getElementById("maxBadge"),
      problem: document.getElementById("problem"),
      feedback: document.getElementById("feedback"),
      feedbackLine1: document.getElementById("feedbackLine1"),
      feedbackLine2: document.getElementById("feedbackLine2"),
      answers: document.getElementById("answers"),
      levelUpOverlay: document.getElementById("levelUpOverlay"),
      levelUpNum: document.getElementById("levelUpNum"),
      levelUpConfetti: document.getElementById("levelUpConfetti"),
      levelUpContinueBtn: document.getElementById("levelUpContinueBtn"),
      winOverlay: document.getElementById("winOverlay"),
      winConfetti: document.getElementById("winConfetti"),
      winReplayBtn: document.getElementById("winReplayBtn"),
      winMenuBtn: document.getElementById("winMenuBtn"),
      resetOverlay: document.getElementById("resetOverlay"),
      resetCancelBtn: document.getElementById("resetCancelBtn"),
      resetConfirmBtn: document.getElementById("resetConfirmBtn")
    };

    var STAR_PATH = "M12 2 L14.9 8.6 L22 9.3 L16.5 14 L18.2 21 L12 17.3 L5.8 21 L7.5 14 L2 9.3 L9.1 8.6 Z";

    for (var s = 0; s < STARS_TO_LEVEL_UP; s++) {
      var starSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      starSvg.setAttribute("viewBox", "0 0 24 24");
      var starPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      starPath.setAttribute("d", STAR_PATH);
      starSvg.appendChild(starPath);
      els.stars.appendChild(starSvg);
    }

    function renderLevel() {
      els.levelNum.textContent = String(state.level);
      els.levelNum.setAttribute("data-mode", state.mode || "");
      var starEls = els.stars.querySelectorAll("svg");
      for (var i = 0; i < starEls.length; i++) {
        starEls[i].classList.toggle("filled", i < state.correctStreak);
      }
      els.maxBadge.hidden = state.level !== MAX_LEVEL;
    }

    // Multiplication/division sont prioritaires sur addition/soustraction :
    // si l'enchaînement gauche-à-droite du calcul costaud commence par un
    // +/− suivi d'un ×/÷, il faut des parenthèses autour des 2 premiers
    // termes pour que l'écriture mathématique reste correcte.
    function opTier(opKey) {
      return (opKey === "mul" || opKey === "div") ? 2 : 1;
    }

    function renderProblem() {
      var p = state.problem;
      els.problem.innerHTML = "";
      els.problem.setAttribute("data-terms", String(p.terms.length));

      function appendNum(term) {
        var el = document.createElement("span");
        el.className = "num";
        el.textContent = String(term);
        els.problem.appendChild(el);
      }

      function appendOp(opKey) {
        var el = document.createElement("span");
        el.className = "op";
        el.setAttribute("data-op", opKey);
        el.setAttribute("aria-label", OP_ARIA_LABEL[opKey]);
        el.textContent = OP_SYMBOL[opKey];
        els.problem.appendChild(el);
      }

      function appendParen(text) {
        var el = document.createElement("span");
        el.className = "paren";
        el.textContent = text;
        els.problem.appendChild(el);
      }

      var needsParens = p.ops.length > 1 && opTier(p.ops[0]) < opTier(p.ops[1]);

      if (needsParens) appendParen("(");
      appendNum(p.terms[0]);
      appendOp(p.ops[0]);
      appendNum(p.terms[1]);
      if (needsParens) appendParen(")");
      if (p.ops.length > 1) {
        appendOp(p.ops[1]);
        appendNum(p.terms[2]);
      }

      var eqEl = document.createElement("span");
      eqEl.className = "eq";
      eqEl.textContent = "=";
      els.problem.appendChild(eqEl);

      var qEl = document.createElement("span");
      qEl.className = "q";
      qEl.textContent = "?";
      els.problem.appendChild(qEl);

      els.problem.classList.remove("pop");
      void els.problem.offsetWidth;
      els.problem.classList.add("pop");
    }

    var EMOJI_RE = /([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}])/gu;

    function withEmojiSpans(text) {
      return text.replace(EMOJI_RE, '<span class="emoji">$1</span>');
    }

    function setFeedback(tone, line1, line2) {
      els.feedback.setAttribute("data-tone", tone || "");
      els.feedbackLine1.innerHTML = line1 ? withEmojiSpans(line1) : "";
      els.feedbackLine2.innerHTML = line2 ? withEmojiSpans(line2) : "";
    }

    function renderAnswers() {
      els.answers.innerHTML = "";
      var palette = shuffle(CANDY_COLORS.slice());
      state.problem.choices.forEach(function (value, idx) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "answer-btn " + palette[idx % palette.length];
        btn.textContent = String(value);
        btn.setAttribute("aria-label", "Répondre " + value);
        btn.addEventListener("click", function () { onAnswer(value, btn); });
        els.answers.appendChild(btn);
      });
    }

    function onAnswer(value, btn) {
      if (state.locked) return;
      state.locked = true;

      var buttons = Array.prototype.slice.call(els.answers.querySelectorAll(".answer-btn"));
      var isCorrect = value === state.problem.answer;
      var leveledUp = false;
      var leveledDown = false;

      buttons.forEach(function (b) {
        b.disabled = true;
        var v = Number(b.textContent);
        if (v === state.problem.answer) {
          b.classList.add("is-correct");
        } else if (b === btn) {
          b.classList.add("is-wrong");
        } else {
          b.classList.add("is-faded");
        }
      });

      if (!isCorrect) btn.classList.add("shake");

      var justWon = false;

      if (isCorrect) {
        state.wrongStreak = 0;
        state.correctStreak++;
        if (state.correctStreak >= STARS_TO_LEVEL_UP) {
          if (state.level < MAX_LEVEL) {
            state.level++;
            leveledUp = true;
          } else {
            justWon = true;
          }
          state.correctStreak = 0;
        }
        setFeedback("correct", "Bravo ! 🎉", "");
      } else {
        state.correctStreak = 0;
        state.wrongStreak++;
        if (state.wrongStreak >= MISTAKES_TO_LEVEL_DOWN) {
          if (state.level > MIN_LEVEL) { state.level--; leveledDown = true; }
          state.wrongStreak = 0;
        }
        setFeedback("wrong", "Essaie encore ! 💪", leveledDown ? "On continue, tu vas y arriver ! 🙂" : "");
      }

      // La bulle de niveau/étoiles ne se met à jour qu'une fois l'écran de
      // célébration refermé, pour ne pas montrer le nouveau niveau avant.
      if (!leveledUp && !justWon) renderLevel();
      saveProgress();

      if (leveledUp) {
        window.setTimeout(function () { showLevelUp(state.level); }, 1100);
      } else if (justWon) {
        window.setTimeout(showWin, 1100);
      } else {
        window.setTimeout(nextProblem, isCorrect ? 1100 : 1600);
      }
    }

    function nextProblem() {
      state.problem = generateProblem(state.problem);
      state.locked = false;
      setFeedback("", "", "");
      renderProblem();
      renderAnswers();
    }

    var CONFETTI_COLORS = ["var(--green-add)", "var(--orange-sub)", "var(--candy-blue)", "var(--candy-pink)", "var(--gold)"];

    function spawnConfetti(container, count) {
      container.innerHTML = "";
      for (var i = 0; i < count; i++) {
        var piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = randInt(2, 96) + "%";
        piece.style.background = CONFETTI_COLORS[randInt(0, CONFETTI_COLORS.length - 1)];
        piece.style.setProperty("--drift", randInt(-70, 70) + "px");
        piece.style.animationDelay = (Math.random() * 0.5).toFixed(2) + "s";
        piece.style.animationDuration = (2 + Math.random()).toFixed(2) + "s";
        container.appendChild(piece);
      }
    }

    var THEME_COLOR_DEFAULT = "#4fb3e8";
    var THEME_COLOR_BAR = "#e5f4fc";
    var THEME_COLOR_CELEBRATE = "#ffd166";
    var themeColorMeta = document.getElementById("themeColorMeta");

    function setThemeColor(color) {
      if (themeColorMeta) themeColorMeta.setAttribute("content", color);
    }

    function showLevelUp(newLevel) {
      els.levelUpNum.textContent = String(newLevel);
      spawnConfetti(els.levelUpConfetti, 26);
      els.levelUpOverlay.hidden = false;
      setThemeColor(THEME_COLOR_CELEBRATE);
    }

    function showWin() {
      spawnConfetti(els.winConfetti, 34);
      els.winOverlay.hidden = false;
      setThemeColor(THEME_COLOR_CELEBRATE);
    }

    function categoryOfMode(mode) {
      if (mode === "add" || mode === "sub" || mode === "mul" || mode === "div" || MIX_MODES[mode]) return "2";
      if (MODE_TO_OP_3[mode] || mode === "costaud") return "3";
      return null;
    }

    function showMenuScreen(screen) {
      els.menuHome.hidden = screen !== "home";
      els.menuTerms2.hidden = screen !== "2";
      els.menuTerms3.hidden = screen !== "3";
    }

    function openMenu() {
      showMenuScreen(categoryOfMode(state.mode) || "home");
      els.menuOverlay.hidden = false;
      setThemeColor(THEME_COLOR_DEFAULT);
    }

    function closeMenu() {
      els.menuOverlay.hidden = true;
    }

    function selectMode(mode) {
      state.mode = mode;
      var saved = loadProgress()[mode];
      if (typeof saved === "number") saved = { level: saved, stars: 0 };
      var savedLevel = saved && typeof saved.level === "number" ? saved.level : NaN;
      var savedStars = saved && typeof saved.stars === "number" ? saved.stars : NaN;
      state.level = (savedLevel >= MIN_LEVEL && savedLevel <= MAX_LEVEL) ? savedLevel : MIN_LEVEL;
      state.correctStreak = (savedStars >= 0 && savedStars < STARS_TO_LEVEL_UP) ? savedStars : 0;
      state.wrongStreak = 0;
      state.locked = false;
      closeMenu();
      setThemeColor(THEME_COLOR_BAR);
      renderLevel();
      nextProblem();
    }

    els.menuBtn.addEventListener("click", openMenu);
    els.modeCards.forEach(function (card) {
      card.addEventListener("click", function () { selectMode(card.getAttribute("data-mode")); });
    });
    els.categoryCards.forEach(function (card) {
      card.addEventListener("click", function () { showMenuScreen(card.getAttribute("data-category")); });
    });
    els.terms2BackBtn.addEventListener("click", function () { showMenuScreen("home"); });
    els.terms3BackBtn.addEventListener("click", function () { showMenuScreen("home"); });

    els.levelNum.addEventListener("click", function () {
      if (!state.mode) return;
      els.resetOverlay.hidden = false;
    });

    els.resetCancelBtn.addEventListener("click", function () {
      els.resetOverlay.hidden = true;
    });

    els.resetConfirmBtn.addEventListener("click", function () {
      els.resetOverlay.hidden = true;
      state.level = MIN_LEVEL;
      state.correctStreak = 0;
      state.wrongStreak = 0;
      state.locked = false;
      renderLevel();
      saveProgress();
      nextProblem();
    });

    els.levelUpContinueBtn.addEventListener("click", function () {
      els.levelUpOverlay.hidden = true;
      setThemeColor(THEME_COLOR_BAR);
      renderLevel();
      nextProblem();
    });

    els.winReplayBtn.addEventListener("click", function () {
      els.winOverlay.hidden = true;
      setThemeColor(THEME_COLOR_BAR);
      state.level = MIN_LEVEL;
      state.correctStreak = 0;
      state.wrongStreak = 0;
      renderLevel();
      saveProgress();
      nextProblem();
    });

    els.winMenuBtn.addEventListener("click", function () {
      els.winOverlay.hidden = true;
      state.level = MIN_LEVEL;
      state.correctStreak = 0;
      state.wrongStreak = 0;
      renderLevel();
      saveProgress();
      openMenu();
    });

    renderLevel();
    openMenu();
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
